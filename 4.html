<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图书管理系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
        body { background-color: #f5f7fa; color: #333; }
        .container { display: flex; min-height: 100vh; }
        /* 侧边栏 */
        .sidebar { width: 220px; background: #2c3e50; color: #fff; padding: 20px 0; }
        .sidebar-header { text-align: center; padding: 20px 0; border-bottom: 1px solid #34495e; }
        .sidebar-header h1 { font-size: 22px; }
        .sidebar-menu { list-style: none; margin-top: 20px; }
        .sidebar-menu a {
            display: block; padding: 12px 25px; color: #bdc3c7;
            text-decoration: none;
        }
        .sidebar-menu a:hover, .sidebar-menu a.active {
            background: #34495e; color: #fff; border-left: 4px solid #3498db;
        }
        /* 主内容 */
        .main-content { flex: 1; display: flex; flex-direction: column; }
        .top-nav {
            background: #fff; padding: 15px 30px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: flex; justify-content: space-between;
        }
        .content { padding: 30px; flex: 1; }
        .page-section { display: none; }
        .page-section.active { display: block; }
        .page-header {
            display: flex; justify-content: space-between;
            align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap:15px;
        }
        .search-box { display: flex; gap:8px; }
        .search-input {
            padding:8px 12px; border:1px solid #ddd; border-radius:4px; width:240px;
        }
        /* 按钮 */
        .btn { padding:8px 16px; border:none; border-radius:4px; cursor:pointer; }
        .btn-primary { background: #3498db; color: #fff; }
        .btn-warning { background: #f39c12; color: #fff; }
        .btn-danger { background: #e74c3c; color: #fff; }
        .btn-default { background: #95a5a6; color: #fff; }
        /* 表格 */
        .table-container { background: #fff; border-radius:8px; box-shadow:0 2px 10px #00000008; overflow:hidden; margin-bottom:20px; }
        .data-table { width:100%; border-collapse: collapse; }
        .data-table th,.data-table td { padding:12px 15px; text-align:left; border-bottom:1px solid #eee; }
        .data-table th { background: #f8f9fa; }
        /* 分页 */
        .pagination { display:flex; justify-content:center; align-items:center; gap:8px; }
        .page-btn { padding:6px 12px; border:1px solid #ddd; background:#fff; border-radius:4px; cursor:pointer; }
        .page-btn:disabled { opacity:0.5; cursor:not-allowed; }
        /* 弹窗 */
        .modal-mask {
            position:fixed; top:0; left:0; width:100%; height:100%;
            background:rgba(0,0,0,0.5); display:none; align-items:center; justify-content:center; z-index:999;
        }
        .modal-mask.show { display:flex; }
        .modal-box { width:450px; background:#fff; border-radius:8px; padding:25px; }
        .form-item { margin-bottom:15px; }
        .form-item label { display:block; margin-bottom:6px; }
        .form-item input { width:100%; padding:10px; border:1px solid #ddd; border-radius:4px; }
        .form-btn-group { text-align:right; margin-top:20px; }
    </style>
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <div class="sidebar-header"><h1>图书管理系统</h1></div>
            <ul class="sidebar-menu">
                <li><a href="#" class="active" data-target="book-page">图书管理</a></li>
                <li><a href="#" data-target="reader-page">读者管理</a></li>
            </ul>
        </aside>
        <main class="main-content">
            <nav class="top-nav">
                <div>欢迎使用图书管理系统</div>
                <div>管理员</div>
            </nav>
            <div class="content">
                <!-- 图书 -->
                <section id="book-page" class="page-section active">
                    <div class="page-header">
                        <h2>图书管理</h2>
                        <div class="search-box">
                            <input class="search-input" id="bookSearch" placeholder="搜索书名/作者/ID">
                            <button class="btn btn-primary" id="bookSearchBtn">搜索</button>
                        </div>
                        <button class="btn btn-primary" id="addBookBtn">新增图书</button>
                    </div>
                    <div class="table-container">
                        <table class="data-table">
                            <thead>
                                <tr><th>图书ID</th><th>书名</th><th>作者</th><th>出版社</th><th>出版日期</th><th>库存</th><th>操作</th></tr>
                            </thead>
                            <tbody id="bookTbody"></tbody>
                        </table>
                    </div>
                    <div class="pagination" id="bookPagination"></div>
                </section>
                <!-- 读者 -->
                <section id="reader-page" class="page-section">
                    <div class="page-header">
                        <h2>读者管理</h2>
                        <div class="search-box">
                            <input class="search-input" id="readerSearch" placeholder="搜索姓名/ID/电话">
                            <button class="btn btn-primary" id="readerSearchBtn">搜索</button>
                        </div>
                        <button class="btn btn-primary" id="addReaderBtn">新增读者</button>
                    </div>
                    <div class="table-container">
                        <table class="data-table">
                            <thead>
                                <tr><th>读者ID</th><th>姓名</th><th>性别</th><th>年龄</th><th>电话</th><th>注册日期</th><th>操作</th></tr>
                            </thead>
                            <tbody id="readerTbody"></tbody>
                        </table>
                    </div>
                    <div class="pagination" id="readerPagination"></div>
                </section>
            </div>
        </main>
    </div>

    <!-- 图书弹窗 -->
    <div class="modal-mask" id="bookModal">
        <div class="modal-box">
            <h3 id="bookModalTitle">新增图书</h3>
            <div class="form-item"><label>图书ID</label><input id="bookId"></div>
            <div class="form-item"><label>书名</label><input id="bookName"></div>
            <div class="form-item"><label>作者</label><input id="bookAuthor"></div>
            <div class="form-item"><label>出版社</label><input id="bookPub"></div>
            <div class="form-item"><label>出版日期</label><input type="date" id="bookDate"></div>
            <div class="form-item"><label>库存</label><input type="number" id="bookStock"></div>
            <div class="form-btn-group">
                <button class="btn btn-default" id="closeBookModal">取消</button>
                <button class="btn btn-primary" id="saveBookBtn">保存</button>
            </div>
        </div>
    </div>

    <!-- 读者弹窗 -->
    <div class="modal-mask" id="readerModal">
        <div class="modal-box">
            <h3 id="readerModalTitle">新增读者</h3>
            <div class="form-item"><label>读者ID</label><input id="readerId"></div>
            <div class="form-item"><label>姓名</label><input id="readerName"></div>
            <div class="form-item"><label>性别</label><input id="readerSex"></div>
            <div class="form-item"><label>年龄</label><input type="number" id="readerAge"></div>
            <div class="form-item"><label>电话</label><input id="readerTel"></div>
            <div class="form-item"><label>注册日期</label><input type="date" id="readerRegDate"></div>
            <div class="form-btn-group">
                <button class="btn btn-default" id="closeReaderModal">取消</button>
                <button class="btn btn-primary" id="saveReaderBtn">保存</button>
            </div>
        </div>
    </div>

    <script>
        // ========== 本地存储持久化封装 ==========
        const Storage = {
            get(key) {
                const data = localStorage.getItem(key);
                return data ? JSON.parse(data) : null;
            },
            set(key, value) {
                localStorage.setItem(key, JSON.stringify(value));
            }
        };

        // ========== 数据：优先从本地存储读取，没有则用默认数据 ==========
        let bookList = Storage.get("bookList") || [
            { id: '1001', name: '《平凡的世界》', author: '路遥', pub: '人民文学出版社', date: '1986-12-01', stock: 25 },
            { id: '1002', name: '《活着》', author: '余华', pub: '作家出版社', date: '2012-08-01', stock: 18 }
        ];
        let readerList = Storage.get("readerList") || [
            { id: '2001', name: '张三', sex: '男', age: 22, tel: '13800138001', regDate: '2023-03-15' }
        ];

        // 每次数据修改后自动保存到本地
        function saveBook() { Storage.set("bookList", bookList); }
        function saveReader() { Storage.set("readerList", readerList); }

        // 分页配置
        const pageSize = 3;
        let bookPage = 1, readerPage = 1;
        let bookSearchKey = '', readerSearchKey = '';

        // 页面切换
        document.querySelectorAll('.sidebar-menu a').forEach(link => {
            link.onclick = e => {
                e.preventDefault();
                document.querySelectorAll('.sidebar-menu a').forEach(l => l.classList.remove('active'));
                document.querySelectorAll('.page-section').forEach(p => p.classList.remove('active'));
                link.classList.add('active');
                document.getElementById(link.dataset.target).classList.add('active');
            };
        });

        // ========== 图书模块 ==========
        const bookModal = document.getElementById('bookModal');
        const bookTbody = document.getElementById('bookTbody');
        const bookPagination = document.getElementById('bookPagination');

        function renderBook() {
            let filtered = bookList.filter(item =>
                item.id.includes(bookSearchKey) || item.name.includes(bookSearchKey) || item.author.includes(bookSearchKey)
            );
            let total = filtered.length;
            let totalPage = Math.ceil(total / pageSize);
            let start = (bookPage - 1) * pageSize;
            let showList = filtered.slice(start, start + pageSize);

            bookTbody.innerHTML = '';
            showList.forEach(item => {
                bookTbody.innerHTML += `
                    <tr>
                        <td>${item.id}</td>
                        <td>${item.name}</td>
                        <td>${item.author}</td>
                        <td>${item.pub}</td>
                        <td>${item.date}</td>
                        <td>${item.stock}</td>
                        <td>
                            <button class="btn btn-warning editBook" data-id="${item.id}">编辑</button>
                            <button class="btn btn-danger delBook" data-id="${item.id}">删除</button>
                        </td>
                    </tr>
                `;
            });

            bookPagination.innerHTML = `
                <button class="page-btn" ${bookPage <= 1 ? 'disabled' : ''} onclick="bookPage--;renderBook()">上一页</button>
                <span>第 ${bookPage} / ${totalPage || 1} 页</span>
                <button class="page-btn" ${bookPage >= totalPage ? 'disabled' : ''} onclick="bookPage++;renderBook()">下一页</button>
            `;
            bindBookBtn();
        }

        // 图书搜索
        document.getElementById('bookSearchBtn').onclick = () => {
            bookSearchKey = document.getElementById('bookSearch').value.trim();
            bookPage = 1;
            renderBook();
        };

        // 图书增删改
        document.getElementById('addBookBtn').onclick = () => {
            document.querySelectorAll('#bookModal input').forEach(i => i.value = '');
            document.getElementById('bookModalTitle').innerText = '新增图书';
            bookModal.classList.add('show');
        };
        document.getElementById('closeBookModal').onclick = () => bookModal.classList.remove('show');
        document.getElementById('saveBookBtn').onclick = () => {
            let id = document.getElementById('bookId').value.trim();
            let name = document.getElementById('bookName').value.trim();
            let author = document.getElementById('bookAuthor').value.trim();
            let pub = document.getElementById('bookPub').value.trim();
            let date = document.getElementById('bookDate').value;
            let stock = document.getElementById('bookStock').value;
            if (!id || !name) return alert('请填写必填项');

            let idx = bookList.findIndex(b => b.id === id);
            let data = { id, name, author, pub, date, stock };
            if (idx > -1) bookList[idx] = data;
            else bookList.push(data);

            saveBook(); // 保存到本地
            bookModal.classList.remove('show');
            renderBook();
        };

        function bindBookBtn() {
            document.querySelectorAll('.editBook').forEach(btn => {
                btn.onclick = () => {
                    let data = bookList.find(b => b.id === btn.dataset.id);
                    document.getElementById('bookId').value = data.id;
                    document.getElementById('bookName').value = data.name;
                    document.getElementById('bookAuthor').value = data.author;
                    document.getElementById('bookPub').value = data.pub;
                    document.getElementById('bookDate').value = data.date;
                    document.getElementById('bookStock').value = data.stock;
                    document.getElementById('bookModalTitle').innerText = '编辑图书';
                    bookModal.classList.add('show');
                };
            });
            document.querySelectorAll('.delBook').forEach(btn => {
                btn.onclick = () => {
                    if (!confirm('确定删除？')) return;
                    bookList = bookList.filter(b => b.id !== btn.dataset.id);
                    saveBook(); // 保存到本地
                    renderBook();
                };
            });
        }

        // ========== 读者模块 ==========
        const readerModal = document.getElementById('readerModal');
        const readerTbody = document.getElementById('readerTbody');
        const readerPagination = document.getElementById('readerPagination');

        function renderReader() {
            let filtered = readerList.filter(item =>
                item.id.includes(readerSearchKey) || item.name.includes(readerSearchKey) || item.tel.includes(readerSearchKey)
            );
            let total = filtered.length;
            let totalPage = Math.ceil(total / pageSize);
            let start = (readerPage - 1) * pageSize;
            let showList = filtered.slice(start, start + pageSize);

            readerTbody.innerHTML = '';
            showList.forEach(item => {
                readerTbody.innerHTML += `
                    <tr>
                        <td>${item.id}</td>
                        <td>${item.name}</td>
                        <td>${item.sex}</td>
                        <td>${item.age}</td>
                        <td>${item.tel}</td>
                        <td>${item.regDate}</td>
                        <td>
                            <button class="btn btn-warning editReader" data-id="${item.id}">编辑</button>
                            <button class="btn btn-danger delReader" data-id="${item.id}">删除</button>
                        </td>
                    </tr>
                `;
            });

            readerPagination.innerHTML = `
                <button class="page-btn" ${readerPage <= 1 ? 'disabled' : ''} onclick="readerPage--;renderReader()">上一页</button>
                <span>第 ${readerPage} / ${totalPage || 1} 页</span>
                <button class="page-btn" ${readerPage >= totalPage ? 'disabled' : ''} onclick="readerPage++;renderReader()">下一页</button>
            `;
            bindReaderBtn();
        }

        // 读者搜索
        document.getElementById('readerSearchBtn').onclick = () => {
            readerSearchKey = document.getElementById('readerSearch').value.trim();
            readerPage = 1;
            renderReader();
        };

        // 读者增删改
        document.getElementById('addReaderBtn').onclick = () => {
            document.querySelectorAll('#readerModal input').forEach(i => i.value = '');
            document.getElementById('readerModalTitle').innerText = '新增读者';
            readerModal.classList.add('show');
        };
        document.getElementById('closeReaderModal').onclick = () => readerModal.classList.remove('show');
        document.getElementById('saveReaderBtn').onclick = () => {
            let id = document.getElementById('readerId').value.trim();
            let name = document.getElementById('readerName').value.trim();
            let sex = document.getElementById('readerSex').value.trim();
            let age = document.getElementById('readerAge').value;
            let tel = document.getElementById('readerTel').value.trim();
            let regDate = document.getElementById('readerRegDate').value;
            if (!id || !name) return alert('请填写必填项');

            let idx = readerList.findIndex(r => r.id === id);
            let data = { id, name, sex, age, tel, regDate };
            if (idx > -1) readerList[idx] = data;
            else readerList.push(data);

            saveReader(); // 保存到本地
            readerModal.classList.remove('show');
            renderReader();
        };

        function bindReaderBtn() {
            document.querySelectorAll('.editReader').forEach(btn => {
                btn.onclick = () => {
                    let data = readerList.find(r => r.id === btn.dataset.id);
                    document.getElementById('readerId').value = data.id;
                    document.getElementById('readerName').value = data.name;
                    document.getElementById('readerSex').value = data.sex;
                    document.getElementById('readerAge').value = data.age;
                    document.getElementById('readerTel').value = data.tel;
                    document.getElementById('readerRegDate').value = data.regDate;
                    document.getElementById('readerModalTitle').innerText = '编辑读者';
                    readerModal.classList.add('show');
                };
            });
            document.querySelectorAll('.delReader').forEach(btn => {
                btn.onclick = () => {
                    if (!confirm('确定删除？')) return;
                    readerList = readerList.filter(r => r.id !== btn.dataset.id);
                    saveReader(); // 保存到本地
                    renderReader();
                };
            });
        }

        // 初始化
        renderBook();
        renderReader();
    </script>
</body>
</html>
