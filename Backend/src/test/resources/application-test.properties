# H2 内存数据库配置（用于测试）
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MYSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# H2 控制台配置（可选）
spring.h2.console.enabled=true

# 自动执行 schema.sql 和 data.sql
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.encoding=utf-8

# MyBatis 配置
mybatis.type-aliases-package=com.library.system.entity
mybatis.mapper-locations=classpath*:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

# 解决 Mapper 扫描问题
mybatis.check-config-location=false

# 服务器配置（测试不需要启动服务器）
server.port=8080

# 禁用 Spring Security（测试用）
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,\
  org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration,\
  org.springframework.boot.autoconfigure.security.servlet.SecurityFilterAutoConfiguration,\
  org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration,\
  org.springframework.boot.autoconfigure.security.oauth2.client.servlet.OAuth2ClientAutoConfiguration,\
  org.springframework.boot.autoconfigure.security.SecurityAutoConfiguration,\
  org.springframework.boot.autoconfigure.security.servlet.DefaultSecurityFilterChainAutoConfiguration

# 测试阶段关闭鉴权过滤器，避免影响现有用例
app.auth.enabled=false

# 禁用默认的安全用户配置
spring.security.user.name=
spring.security.user.password=
spring.security.user.roles=