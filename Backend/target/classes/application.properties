# MySQL 数据库配置
spring.datasource.url=jdbc:mysql://localhost:3306/library_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=202405567223
spring.datasource.password=202405567223
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 自动执行 schema.sql 和 data.sql
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.encoding=utf-8

# MyBatis 配置
mybatis.type-aliases-package=com.library.system.entity

# 将数据库下划线命名自动映射为驼峰属性（user_id -> userId）
mybatis.configuration.map-underscore-to-camel-case=true

# 服务器配置
server.port=8080