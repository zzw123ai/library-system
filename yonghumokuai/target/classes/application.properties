# 本地开发使用 H2 内存数据库（默认配置）
spring.datasource.url=jdbc:h2:mem:librarydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# 自动执行 schema.sql 和 data.sql
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# MyBatis 配置
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.library.system.entity

# 将数据库下划线命名自动映射为驼峰属性（user_id -> userId）
mybatis.configuration.map-underscore-to-camel-case=true

# 服务器配置
server.port=8080